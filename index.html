<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎒 數學遊戲樂園 🎒</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 800px;
            width: 100%;
        }
        .game-btn {
            background-color: white;
            border: 2px solid #3498db;
            border-radius: 12px;
            padding: 25px 20px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #3498db;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-decoration: none;
            text-align: center;
        }
        /* 滑鼠移上去的視覺效果 */
        .game-btn:hover {
            background-color: #3498db;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(52, 152, 219, 0.3);
        }
        /* 準備中按鈕的樣式 */
        .game-btn.coming-soon {
            border: 2px dashed #bdc3c7;
            color: #95a5a6;
            background-color: #f8f9fa;
            cursor: not-allowed;
        }
        .game-btn.coming-soon:hover {
            transform: none;
            box-shadow: none;
            background-color: #f8f9fa;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <h1>🎒 數學遊戲樂園</h1>
    <div class="subtitle">小朋友，選擇一個你想挑戰的數學任務吧！</div>

    <div class="button-grid">
        <!-- 第一個按鈕：連結到 game1 資料夾 -->
        <a href="./game1/" class="game-btn">⚡ 任務一：心算大挑戰</a>
        
        <!-- 未來要新增遊戲，只要複製下面這行，並把 href 改成新資料夾名稱即可 -->
        <!-- <a href="./game2/" class="game-btn">🧮 任務二：九九乘法表</a> -->

        <!-- 預留給學生的看的新按鈕（點了不會有反應） -->
        <div class="game-btn coming-soon">🔒 新任務期待中...</div>
        <div class="game-btn coming-soon">🔒 新任務期待中...</div>
    </div>

</body>
</html>
