<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 3、4位數加減大挑戰 ⚡</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .game-container { background-color: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 480px; width: 100%; position: relative; }
        h1 { color: #2c3e50; font-size: 1.8rem; margin: 0 0 10px 0; }
        .info-bar { display: flex; justify-content: space-between; font-size: 1.1rem; color: #666; margin-bottom: 10px; }
        .timer-container { width: 100%; background-color: #e0e0e0; border-radius: 10px; height: 12px; overflow: hidden; margin-bottom: 15px; }
        .timer-bar { width: 100%; height: 100%; background-color: #e74c3c; transition: width 0.1s linear; }
        .question { font-size: 2.8rem; font-weight: bold; color: #2980b9; margin: 20px 0; letter-spacing: 2px; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .option-btn { background-color: #f8f9fa; border: 2px solid #3498db; color: #2980b9; font-size: 1.6rem; font-weight: bold; padding: 12px; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .option-btn:hover:not(:disabled) { background-color: #3498db; color: white; transform: scale(1.02); }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }
        .message { margin-top: 15px; font-size: 1.2rem; font-weight: bold; min-height: 25px; }
        .correct { color: #27ae60; }
        .wrong { color: #c0392b; }
        .result-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.98); border-radius: 15px; z-index: 10; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .name-input-section { margin: 10px 0; }
        .name-input-section input { font-size: 1.1rem; padding: 6px; width: 50%; text-align: center; border: 2px solid #ddd; border-radius: 6px; }
        .name-input-section button { font-size: 1.1rem; padding: 6px 12px; background-color: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .leaderboard-table { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 0.95rem; }
        .leaderboard-table th, .leaderboard-table td { padding: 6px; border-bottom: 1px solid #ddd; text-align: center; }
        .leaderboard-table th { background-color: #f2f2f2; }
        .top-rank { font-weight: bold; color: #e74c3c; }
        .restart-btn { font-size: 1.2rem; padding: 8px 20px; background-color: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>⚡ 3、4位數加減大挑戰</h1>
    <div class="info-bar">
        <div>題號：<span id="q-idx">1</span>/10</div>
        <div>倒數：<span id="t-text">30</span>秒</div>
        <div>得分：<span id="score">0</span></div>
    </div>
    <div class="timer-container"><div class="timer-bar" id="t-bar"></div></div>
    <div class="question" id="question">? + ? =</div>
    <div class="options-grid">
        <button class="option-btn" onclick="checkAns(this)" id="opt0">?</button>
        <button class="option-btn" onclick="checkAns(this)" id="opt1">?</button>
        <button class="option-btn" onclick="checkAns(this)" id="opt2">?</button>
        <button class="option-btn" onclick="checkAns(this)" id="opt3">?</button>
    </div>
    <div class="message" id="message"></div>

    <div class="result-overlay" id="res-layer">
        <h2>🎉 挑戰完成！ 🎉</h2>
        <p>答對題數：<span id="f-count">0</span> / 10 題</p>
        <p>最終得分：<span id="f-score">0</span> 分 | 總用時：<span id="f-time">0</span> 秒</p>
        <div class="name-input-section" id="input-box">
            <input type="text" id="p-name" placeholder="請輸入英文名字" maxlength="15">
            <button onclick="saveScore()">登錄排行</button>
        </div>
        <h3>🏆 榮譽排行榜 (前六名)</h3>
        <table class="leaderboard-table">
            <thead><tr><th>名次</th><th>名字</th><th>得分</th><th>總秒數</th></tr></thead>
            <tbody id="leader-body"></tbody>
        </table>
        <button class="restart-btn" onclick="resetGame()">再挑戰一次</button>
    </div>
</div>

<script>
    let n1, n2, ans, op, score = 0, qCount = 1, rCount = 0;
    let tLeft = 30, tInterval, totalSec = 0;

    function getQ() {
        if (qCount > 10) { showEnd(); return; }
        document.getElementById('q-idx').innerText = qCount;
        document.getElementById('message').innerText = '';
        setBtns(true);

        let ok = false;
        while (!ok) {
            n1 = Math.floor(Math.random() * (5999 - 101 + 1)) + 101;
            n2 = Math.floor(Math.random() * (5999 - 101 + 1)) + 101;
            op = Math.random() < 0.5 ? '+' : '-';
            ans = (op === '+') ? (n1 + n2) : (n1 - n2);
            if (ans >= 100) ok = true;
        }
        document.getElementById('question').innerText = `${n1} ${op} ${n2} = ?`;

        let opts = new Set([ans]);
        while (opts.size < 4) {
            let offset = (Math.floor(Math.random() * 50) + 1) * (Math.random() < 0.5 ? 1 : -1);
            if (ans + offset >= 100) opts.add(ans + offset);
        }
        let arr = Array.from(opts).sort(() => Math.random() - 0.5);
        for (let i = 0; i < 4; i++) document.getElementById(`opt${i}`).innerText = arr[i];
        goTimer();
    }

    function goTimer() {
        clearInterval(tInterval); tLeft = 30;
        document.getElementById('t-text').innerText = tLeft;
        document.getElementById('t-bar').style.width = '100%';
        tInterval = setInterval(() => {
            tLeft -= 0.1; totalSec += 0.1;
            if (tLeft <= 0) { clearInterval(tInterval); nextQ(false); }
            else { document.getElementById('t-text').innerText = Math.ceil(tLeft); document.getElementById('t-bar').style.width = (tLeft / 30 * 100) + '%'; }
        }, 100);
    }

    function checkAns(btn) {
        clearInterval(tInterval); setBtns(false);
        let uAns = parseInt(btn.innerText);
        let msg = document.getElementById('message');
        if (uAns === ans) { score += 10; rCount++; msg.innerText = "🎉 答對了！太厲害了！ (+10分)"; msg.className = "message correct"; document.getElementById('score').innerText = score; }
        else { msg.innerText = `❌ 答錯囉！正確答案是 ${ans}`; msg.className = "message wrong"; }
        qCount++; setTimeout(getQ, 1500);
    }

    function nextQ(isAns) {
        setBtns(false);
        let msg = document.getElementById('message');
        msg.innerText = `⏰ 時間到！正確答案是 ${ans}`; msg.className = "message wrong";
        qCount++; setTimeout(getQ, 2000);
    }

    function setBtns(st) { for (let i = 0; i < 4; i++) document.getElementById(`opt${i}`).disabled = !st; }

    function showEnd() {
        clearInterval(tInterval);
        document.getElementById('f-count').innerText = rCount;
        document.getElementById('f-score').innerText = score;
        document.getElementById('f-time').innerText = totalSec.toFixed(1);
        document.getElementById('input-box').style.display = 'block';
        showBoard(); document.getElementById('res-layer').style.display = 'flex';
    }

    function saveScore() {
        let name = document.getElementById('p-name').value.trim();
        // 修正後的規則，移除錯誤的轉義符號
        let englishPattern = /^[A-Za-z0-9\s]+\$/;

        if (!name || !englishPattern.test(name)) { 
            alert("請輸入英文名字或數字！"); 
            return; 
        }
        let board = JSON.parse(localStorage.getItem('math_board')) || [];
        board.push({ name: name, score: score, time: parseFloat(totalSec.toFixed(1)) });
        board.sort((a, b) => b.score !== a.score ? b.score - a.score : a.time - b.time);
        localStorage.setItem('math_board', JSON.stringify(board.slice(0, 6)));
        document.getElementById('input-box').style.display = 'none'; showBoard();
    }

    function showBoard() {
        let board = JSON.parse(localStorage.getItem('math_board')) || [];
        let body = document.getElementById('leader-body'); body.innerHTML = '';
        if (board.length === 0) { body.innerHTML = `<tr><td colspan="4" style="color:#999;">尚無排行，快來爭奪第一！</td></tr>`; return; }
        board.forEach((item, i) => {
            let row = document.createElement('tr');
            row.innerHTML = `<td class="${i < 3 ? 'top-rank' : ''}">${i + 1}</td><td>${item.name}</td><td>${item.score}</td><td>${item.time}秒</td>`;
            body.appendChild(row);
        });
    }

    function resetGame() { score = 0; qCount = 1; rCount = 0; totalSec = 0; document.getElementById('score').innerText = 0; document.getElementById('res-layer').style.display = 'none'; getQ(); }
    getQ();
</script>
</body>
</html>
