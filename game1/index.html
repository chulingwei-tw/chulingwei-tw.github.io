<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 3、4位數加減大挑戰 ⚡</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
        }
        h1 { color: #2c3e50; font-size: 1.8rem; margin-bottom: 5px; }
        .info-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            color: #666;
            margin: 15px 0;
            padding: 0 10px;
        }
        .timer-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .timer-bar {
            width: 100%;
            height: 100%;
            background-color: #e74c3c;
            transition: width 0.1s linear;
        }
        .question { font-size: 2.8rem; font-weight: bold; color: #2980b9; margin: 25px 0; letter-spacing: 2px; }
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #3498db;
            color: #2980b9;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #3498db;
            color: white;
            transform: scale(1.03);
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .message { margin-top: 20px; font-size: 1.2rem; font-weight: bold; min-height: 30px; }
        .correct { color: #27ae60; }
        .wrong { color: #c0392b; }

        /* 結算與排行榜視窗 */
        .result-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.98);
            border-radius: 15px;
            z-index: 10;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .result-overlay h2 { font-size: 2rem; color: #2c3e50; margin: 10px 0 5px 0; }
        .result-overlay p { font-size: 1.2rem; color: #7f8c8d; margin: 5px 0; }
        
        /* 名字輸入框 */
        .name-input-section { margin: 15px 0; }
        .name-input-section input {
            font-size: 1.2rem; padding: 8px; width: 60%;
            text-align: center; border: 2px solid #ddd; border-radius: 6px;
        }
        .name-input-section button {
            font-size: 1.1rem; padding: 8px 15px; background-color: #3498db;
            color: white; border: none; border-radius: 6px; cursor: pointer; margin-left: 5px;
        }

        /* 排行榜表格 */
        .leaderboard-table {
            width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 1rem;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 8px; border-bottom: 1px solid #ddd; text-align: center;
        }
        .leaderboard-table th { background-color: #f2f2f2; color: #333; }
        .top-rank { font-weight: bold; color: #e74c3c; }

        .restart-btn {
            font-size: 1.2rem; padding: 10px 25px;
            background-color: #27ae60; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            margin-top: 15px; font-weight: bold; width: 60%; align-self: center;
        }
        .restart-btn:hover { background-color: #219653; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>⚡ 3、4位數加減大挑戰</h1>
    
    <div class="info-bar">
        <div>題號：<span id="question-idx">1</span> / 10</div>
        <div>倒數：<span id="timer-text">30</span> 秒</div>
        <div>目前得分：<span id="score">0</span></div>
    </div>

    <div class="timer-container">
        <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div class="question" id="question">? + ? =</div>

    <div class="options-grid">
        <button class="option-btn" onclick="checkAnswer(this)" id="opt0">?</button>
        <button class="option-btn" onclick="checkAnswer(this)" id="opt1">?</button>
        <button class="option-btn" onclick="checkAnswer(this)" id="opt2">?</button>
        <button class="option-btn" onclick="checkAnswer(this)" id="opt3">?</button>
    </div>

    <div class="message" id="message"></div>

    <!-- 結算與排行榜視窗 -->
    <div class="result-overlay" id="result-overlay">
        <h2>🎉 挑戰完成！ 🎉</h2>
        <p>答對題數：<span id="final-correct">0</span> / 10 題</p>
        <p>最終得分：<span id="final-score">0</span> 分 | 總花費時間：<span id="final-time">0</span> 秒</p>
        
        <!-- 登錄名字區塊 -->
        <div class="name-input-section" id="name-input-section">
            <input type="text" id="player-name" placeholder="請輸入您的英文名字 (例如: Tom)" maxlength="15">
            <button onclick="submitScore()">登錄排行</button>
        </div>

        <h3>🏆 榮譽排行榜 (前六名)</h3>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>名次</th>
                    <th>名字</th>
                    <th>得分</th>
                    <th>總秒數</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- 排行榜資料會由 JS 動態生成 -->
            </tbody>
        </table>

        <button class="restart-btn" onclick="restartGame()">再挑戰一次</button>
    </div>
</div>

<script>
    let num1, num2, correctAnswer, operator;
    let score = 0;
    let currentQuestionCount = 1;
    let correctCount = 0;
    
    // 計時與統計總秒數
    let timeLeft = 30;
    let timerInterval;
    let totalSecondsUsed = 0; // 紀錄十題總共花了多少秒

    function generateQuestion() {
        if (currentQuestionCount > 10) {
            showEndGame();
            return;
        }

        document.getElementById('question-idx').innerText = currentQuestionCount;
        document.getElementById('message').innerText = '';
        enableButtons(true);

        let valid = false;
        while (!valid) {
            // 💡 依照您的要求，數字調整為 101 ~ 5999 之間
            num1 = Math.floor(Math.random() * (5999 - 101 + 1)) + 101;
            num2 = Math.floor(Math.random() * (5999 - 101 + 1)) + 101;
            operator = Math.floor(Math.random() * 2) === 0 ? '+' : '-';
            correctAnswer = (operator === '+') ? (num1 + num2) : (num1 - num2);

            // 💡 保持不小於 100 的正數規則
            if (correctAnswer >= 100) valid = true;
        }
        
        document.getElementById('question').innerText = `${num1} ${operator} ${num2} = ?`;

        let optionsSet = new Set();
        optionsSet.add(correctAnswer);

        while (optionsSet.size < 4) {
            let offset = (Math.floor(Math.random() * 50) + 1) * (Math.random() < 0.5 ? 1 : -1);
            let wrongAns = correctAnswer + offset;
            if (wrongAns >= 100) {
                optionsSet.add(wrongAns);
            }
        }

        let optionsArray = Array.from(optionsSet);
        optionsArray.sort(() => Math.random() - 0.5);

        for (let i = 0; i < 4; i++) {
            document.getElementById(`opt${i}`).innerText = optionsArray[i];
        }

        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 30;
        document.getElementById('timer-text').innerText = timeLeft;
        document.getElementById('timer-bar').style.width = '100%';

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            totalSecondsUsed += 0.1; // 累加總花費秒數
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timer-text').innerText = 0;
                document.getElementById('timer-bar').style.width = '0%';
                timeOutHandler();
            } else {
                document.getElementById('timer-text').innerText = Math.ceil(timeLeft);
                document.getElementById('timer-bar').style.width = (timeLeft / 30 * 100) + '%';
            }
        }, 100);
    }

    function timeOutHandler() {
        enableButtons(false);
        const messageEl = document.getElementById('message');
        messageEl.innerText = `⏰ 時間到！正確答案是 ${correctAnswer}`;
        messageEl.className = "message wrong";
        
        currentQuestionCount++;
        setTimeout(generateQuestion, 2000);
    }

    function checkAnswer(btnElement) {
        clearInterval(timerInterval);
        enableButtons(false);
        
        const userAnswer = parseInt(btnElement.innerText);
        const messageEl = document.getElementById('message');

        if (userAnswer === correctAnswer) {
            score += 10;
            correctCount++;
            messageEl.innerText = "🎉 答對了！太厲害了！ (+10分)";
            messageEl.className = "message correct";
            document.getElementById('score').innerText = score;
        } else {
            messageEl.innerText = `❌ 答錯囉！正確答案是 ${correctAnswer}`;
            messageEl.className = "message wrong";
        }

        currentQuestionCount++;
        setTimeout(generateQuestion, 1500);
    }

    function enableButtons(status) {
        for (let i = 0; i < 4; i++) {
