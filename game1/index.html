<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 3、4位數加減大挑戰 ⚡</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
        }
        h1 { color: #2c3e50; font-size: 1.8rem; margin-bottom: 5px; }
        .info-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            color: #666;
            margin: 15px 0;
            padding: 0 10px;
        }
        /* 計時器樣式 */
        .timer-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .timer-bar {
            width: 100%;
            height: 100%;
            background-color: #e74c3c;
            transition: width 0.1s linear;
        }
        .question { font-size: 2.8rem; font-weight: bold; color: #2980b9; margin: 25px 0; letter-spacing: 2px; }
        
        /* 四個選項按鈕排版 */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #3498db;
            color: #2980b9;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #3498db;
            color: white;
            transform: scale(1.03);
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .message { margin-top: 20px; font-size: 1.2rem; font-weight: bold; min-height: 30px; }
        .correct { color: #27ae60; }
        .wrong { color: #c0392b; }

        /* 結算畫面彈出視窗 */
        .result-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.96);
            border-radius: 15px;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .result-overlay h2 { font-size: 2.2rem; color: #2c3e50; margin-bottom: 10px; }
        .result-overlay p { font-size: 1.4rem; color: #7f8c8d; margin: 10px 0; }
        .restart-btn {
            font-size: 1.3rem; padding: 12px 30px;
            background-color: #27ae60; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            margin-top: 20px; font-weight: bold;
        }
        .restart-btn:hover { background-color: #219653; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>⚡ 3、4位數加減大挑戰</h1>
    
    <!-- 頂部資訊列 -->
    <div class="info-bar">
        <div>題號：<span id="question-idx">1</span> / 10</div>
        <div>倒數：<span id="timer-text">30</span> 秒</div>
        <div>目前得分：<span id="score">0</span></div>
    </div>

    <!-- 計時進度條 -->
    <div class="timer-container">
        <div class="timer-bar" id="timer-bar"></div>
    </div>

    <!-- 題目區域 -->
    <div class="question" id="question">? + ? =</div>

    <!-- 四個答案選項 -->
    <div class="options-grid">
        <button class="option-btn" onclick="checkAnswer(this)" id="opt0">?</button>
        <button class="option-btn" onclick="checkAnswer(this)" id="opt1">?</button>
        <button class="option-btn" onclick="checkAnswer(this)" id="opt2">?</button>
        <button class="option-btn" onclick="checkAnswer(this)" id="opt3">?</button>
    </div>

    <!-- 訊息提示 -->
    <div class="message" id="message"></div>

    <!-- 10題後的結算畫面 -->
    <div class="result-overlay" id="result-overlay">
        <h2>🎉 挑戰完成！ 🎉</h2>
        <p>答對題數：<span id="final-correct">0</span> / 10 題</p>
        <p>最終得分：<span id="final-score">0</span> 分</p>
        <button class="restart-btn" onclick="restartGame()">再挑戰一次</button>
    </div>
</div>

<script>
    let num1, num2, correctAnswer, operator;
    let score = 0;
    let currentQuestionCount = 1;
    let correctCount = 0;
    
    // 計時器變數
    let timeLeft = 30;
    let timerInterval;

    // 產生新題目與四個選項
    function generateQuestion() {
        if (currentQuestionCount > 10) {
            showEndGame();
            return;
        }

        // 更新介面上的題號
        document.getElementById('question-idx').innerText = currentQuestionCount;
        document.getElementById('message').innerText = '';
        enableButtons(true);

        let valid = false;
        while (!valid) {
            num1 = Math.floor(Math.random() * (9999 - 100 + 1)) + 100;
            num2 = Math.floor(Math.random() * (9999 - 100 + 1)) + 100;
            operator = Math.floor(Math.random() * 2) === 0 ? '+' : '-';
            correctAnswer = (operator === '+') ? (num1 + num2) : (num1 - num2);

            // 確保答案大於等於 100
            if (correctAnswer >= 100) valid = true;
        }
        
        document.getElementById('question').innerText = `${num1} ${operator} ${num2} = ?`;

        // 產生三個錯誤答案（干擾項，會在正確答案的 ±50 範圍內隨機變動，且不與正確答案重複）
        let optionsSet = new Set();
        optionsSet.add(correctAnswer);

        while (optionsSet.size < 4) {
            let offset = (Math.floor(Math.random() * 50) + 1) * (Math.random() < 0.5 ? 1 : -1);
            let wrongAns = correctAnswer + offset;
            if (wrongAns >= 100) { // 確保干擾項也至少是三位數
                optionsSet.add(wrongAns);
            }
        }

        // 將 Set 轉換成陣列並隨機打亂順序
        let optionsArray = Array.from(optionsSet);
        optionsArray.sort(() => Math.random() - 0.5);

        // 將選項塞入四個按鈕
        for (let i = 0; i < 4; i++) {
            document.getElementById(`opt${i}`).innerText = optionsArray[i];
        }

        // 開啟這題的倒數計時
        startTimer();
    }

    // 啟動 30 秒倒數計時器
    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 30;
        document.getElementById('timer-text').innerText = timeLeft;
        document.getElementById('timer-bar').style.width = '100%';

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timer-text').innerText = 0;
                document.getElementById('timer-bar').style.width = '0%';
                timeOutHandler(); // 時間到處理
            } else {
                document.getElementById('timer-text').innerText = Math.ceil(timeLeft);
                document.getElementById('timer-bar').style.width = (timeLeft / 30 * 100) + '%';
            }
        }, 100);
    }

    // 時間到的處理邏輯
    function timeOutHandler() {
        enableButtons(false);
        const messageEl = document.getElementById('message');
        messageEl.innerText = `⏰ 時間到！正確答案是 ${correctAnswer}`;
        messageEl.className = "message wrong";
        
        currentQuestionCount++;
        setTimeout(generateQuestion, 2500); // 2.5秒後進入下一題
    }

    // 檢查點選的答案
    function checkAnswer(btnElement) {
        clearInterval(timerInterval); // 停止計時
        enableButtons(false); // 點選後立刻禁用按鈕防止重複點擊
        
        const userAnswer = parseInt(btnElement.innerText);
        const messageEl = document.getElementById('message');

        if (userAnswer === correctAnswer) {
            score += 10;
            correctCount++;
            messageEl.innerText = "🎉 答對了！太厲害了！ (+10分)";
            messageEl.className = "message correct";
            document.getElementById('score').innerText = score;
        } else {
            messageEl.innerText = `❌ 答錯囉！正確答案是 ${correctAnswer}`;
            messageEl.className = "message wrong";
        }

        currentQuestionCount++;
        setTimeout(generateQuestion, 2000); // 2秒後進入下一題
    }

    // 控制選項按鈕是否可點擊
    function enableButtons(status) {
        for (let i = 0; i < 4; i++) {
            document.getElementById(`opt${i}`).disabled = !status;
        }
    }

    // 顯示結算畫面
    function showEndGame() {
        clearInterval(timerInterval);
        document.getElementById('final-correct').innerText = correctCount;
        document.getElementById('final-score').innerText = score;
        document.getElementById('result-overlay').style.display = 'flex';
    }

    // 重新開始遊戲
    function restartGame() {
        score = 0;
        currentQuestionCount = 1;
        correctCount = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('result-overlay').style.display = 'none';
        generateQuestion();
    }

    // 初始化第一題
    generateQuestion();
</script>

</body>
</html>
